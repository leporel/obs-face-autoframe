name: Build

# Builds the Windows x64 plugin on every push / pull request and publishes a GitHub release for version tags
# (e.g. `v0.1.0`).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: obs-face-autoframe

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # For version tags the tag is the source of truth: it is written into buildspec.json, which CMake uses for
      # the DLL version resource and the version shown in the OBS log.
      - name: Resolve version
        id: version
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $version = $spec.version
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Tag '${{ github.ref_name }}' must look like v1.2.3"
            }
            $spec.version = $version
            $spec | ConvertTo-Json -Depth 10 | Set-Content buildspec.json -Encoding utf8NoBOM
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # OBS sources, obs-deps and Qt are fetched and libobs is built on the first configure; this takes most of
      # the build time, so the result is cached per buildspec.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-windows-x64-${{ hashFiles('buildspec.json') }}

      - name: Configure
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-ci-x64

      - name: Install
        run: cmake --install build_x64 --config RelWithDebInfo --prefix release

      - name: Package
        run: |
          $base = "${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}-windows-x64"
          $symbols = "release-symbols/${{ env.PLUGIN_NAME }}/bin/64bit"
          New-Item -ItemType Directory -Force $symbols | Out-Null
          Move-Item "release/${{ env.PLUGIN_NAME }}/bin/64bit/*.pdb" $symbols
          Compress-Archive -Path "release/${{ env.PLUGIN_NAME }}" -DestinationPath "$base.zip"
          Compress-Archive -Path "release-symbols/${{ env.PLUGIN_NAME }}" -DestinationPath "$base-pdb.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}-windows-x64
          path: '*.zip'

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: true
