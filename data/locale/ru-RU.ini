FilterName="Автокадрирование по лицу"

Tracking.Target="Следить за"
Tracking.Target.Face="Лицом"
Tracking.Target.Body="Телом"
Tracking.DetectInterval="Распознавать каждый N-й кадр"
Tracking.DetectInterval.Description="Распознавание запускается только на каждом N-м кадре, чтобы меньше нагружать видеокарту. Промежуточные кадры используют последний результат."
Tracking.MinConfidence="Минимальная уверенность"
Tracking.DetectWidth="Разрешение распознавания"
Tracking.DetectWidth.Low="Низкое (320 px)"
Tracking.DetectWidth.Medium="Среднее (480 px)"
Tracking.DetectWidth.High="Высокое (640 px)"
Tracking.DetectWidth.Native="Исходное"
Tracking.DetectWidth.Description="Ширина кадра, на котором работает распознавание. Чем меньше, тем быстрее; увеличьте, если мелкие или далёкие лица не находятся. Небольшая зона поиска растягивается на весь этот кадр."

FrameArea="Область кадра"
FrameArea.Description="Камера никогда не показывает ничего за пределами этой области, а при полном отдалении показывает её целиком. Лица ищутся только внутри неё."
FrameArea.Width="Ширина"
FrameArea.Height="Высота"
FrameArea.OffsetX="Сдвиг по горизонтали"
FrameArea.OffsetX.Description="Сдвигает область влево (минус) или вправо (плюс), например если камера стоит не по центру."
FrameArea.OffsetY="Сдвиг по вертикали"

Framing.Mode="Кого показывать"
Framing.Mode.Description="Ближайшего: следит за самым крупным лицом и переключается только на заметно более крупное. Закреплённого: держит первого найденного человека и не замечает остальных, пока он не уйдёт. Всех: держит в кадре всех."
Framing.Mode.SoloLargest="Ближайшего человека"
Framing.Mode.SoloLocked="Закреплённого человека"
Framing.Mode.Group="Всех"
Framing.Mode.GroupLimited="Несколько самых крупных"
Framing.MaxFaces="Сколько людей"
Framing.LockRelease="Ждать закреплённого"
Framing.LockRelease.Description="Сколько закреплённый человек может отсутствовать, прежде чем будет выбран другой."
Framing.Relock="Потом выбрать"
Framing.Relock.Largest="Ближайшего человека"
Framing.Relock.Center="Ближайшего к центру"
Framing.Relock.Last="Ближайшего к прошлому месту"
Framing.ResetLock="Выбрать заново"

Framing="Кадрирование"
Framing.PaddingX="Отступ слева/справа"
Framing.PaddingY="Отступ сверху/снизу"
Framing.Padding.Description="Сколько места оставить вокруг лица, в процентах от размера лица."
Framing.OffsetX="Сдвиг по горизонтали"
Framing.OffsetY="Сдвиг по вертикали"
Framing.Offset.Description="Сдвигает кадр относительно лица, в процентах от размера лица. Положительный сдвиг по вертикали показывает больше под лицом."
Framing.MinZoom="Минимальное приближение"
Framing.MinZoom.Description="1x разрешает отдаляться до всей области кадра."
Framing.MaxZoom="Максимальное приближение"
Framing.MaxZoom.Description="Ограничивает, насколько близко может подъехать камера; сильное приближение делает картинку мягче."

Motion="Движение"
Motion.PositionSmoothing="Плавность движения"
Motion.ZoomSmoothing="Плавность приближения"
Motion.Smoothing.Description="Чем больше, тем медленнее и мягче едет камера; 0 - мгновенно."
Motion.DeadZone="Мёртвая зона"
Motion.DeadZone.Description="Мелкие движения головы внутри этой зоны (процент кадра) не двигают камеру."
Motion.ZoomStability="Стабильность приближения"
Motion.ZoomStability.Description="Размер лица должен измениться больше чем на столько, чтобы камера начала приближать или отдалять."
Motion.MaxPanSpeed="Макс. скорость движения"
Motion.MaxPanSpeed.Description="Ограничение скорости в процентах ширины кадра в секунду. 0 - без ограничения."
Motion.Prediction="Предугадывание движения"
Motion.Prediction.Description="Камера чуть опережает движение, чтобы компенсировать задержку распознавания. Слишком много - будет проскакивать."

Idle="Когда никого нет"
Idle.HoldTime="Держать кадр"
Idle.HoldTime.Description="Сколько держать последний кадр, например если человек на секунду отвернулся."
Idle.Then="Потом"
Idle.Then.ZoomOut="Отдалиться до области кадра"
Idle.Then.KeepLast="Остаться на месте"

Debug.View="Режим отладки"
Debug.View.Description="Показывает всю картинку вместо приближенной, с рамками: найденные лица (красные), область кадра (зелёная), отслеживаемые люди (жёлтые - в кадре, серые - игнорируются), цель (голубая) и рамка камеры (белая). Раз в 5 секунд пишет скорость распознавания в лог OBS. Видно и в стриме, и в записи, поэтому включайте только на время настройки."

Status.SdkUnavailable="NVIDIA AR SDK недоступен"
Status.NeedD3D11="OBS должен использовать рендер Direct3D 11"
Status.NeedNvidiaGpu="OBS рисует не на видеокарте NVIDIA"
Status.DetectorFailed="Ошибка распознавания"
Status.EffectMissing="Файлы данных плагина отсутствуют или повреждены (effects/autoframe.effect)"

Tracking.Target.Description="За чем следит камера. Лицо - крупный план головы и плеч; Тело - вся видимая фигура."
Tracking.MinConfidence.Description="Находки, в которых распознавание не уверено, игнорируются. Увеличьте, если за лицо принимаются посторонние предметы; уменьшите, если настоящие лица теряются."
Framing.MaxFaces.Description="Сколько самых крупных (ближайших) людей держать в кадре."
Framing.Relock.Description="Кого выбрать, если закреплённого человека нет дольше времени ожидания."
Framing.ResetLock.Description="Забыть текущего человека и сразу выбрать заново."

FrameArea.Size.Description="Размер области в процентах от картинки вебки."
FrameArea.OffsetY.Description="Сдвигает область вверх (минус) или вниз (плюс)."

Framing.Description="Как человек размещается в кадре и насколько близко может подъехать камера."
Framing.Padding.Body.Description="Сколько места оставить вокруг фигуры, в процентах от её размера. Используется при слежении за телом."
Framing.Offset.Body.Description="Сдвигает кадр относительно фигуры, в процентах от её размера. Используется при слежении за телом."

Motion.Description="Как виртуальная камера перемещается между положениями."
Idle.Description="Что происходит, когда никто не найден."
Idle.Then.Description="Отдалиться - показать всю область кадра; Остаться - держать последний кадр, пока кто-нибудь не появится."

Output="Выход"
Output.Description="Размер и качество картинки на выходе фильтра."
Output.Size="Размер выхода"
Output.Size.Description="Как у вебки - размер не меняется. Свой - любой размер, например 1080x1920 для вертикального стрима; тогда камера кадрирует с этими пропорциями."
Output.Size.Source="Как у вебки"
Output.Size.Custom="Свой"
Output.Width="Ширина"
Output.Height="Высота"
Output.Custom.Description="Размер выхода в пикселях."
Output.ScaleFilter="Масштабирование"
Output.ScaleFilter.Description="Как увеличивается приближенная картинка. Билинейное - самое лёгкое; бикубическое - чётче; Ланцош - самое чёткое, но на резких краях может давать лёгкий ореол."
Output.ScaleFilter.Bilinear="Билинейное"
Output.ScaleFilter.Bicubic="Бикубическое"
Output.ScaleFilter.Lanczos="Ланцош"

Status.Retrying="Распознавание перезапустится автоматически через несколько секунд."
Status.GaveUp="Автоматические перезапуски не помогли. Измените любую настройку, чтобы попробовать снова."
