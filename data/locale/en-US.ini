FilterName="Face Auto-Frame"

Tracking.Target="Track"
Tracking.Target.Face="Face"
Tracking.Target.Body="Body"
Tracking.DetectInterval="Detect every N frames"
Tracking.DetectInterval.Description="Run detection only on every N-th frame to save GPU time. Frames in between reuse the last result."
Tracking.MinConfidence="Minimum confidence"
Tracking.DetectWidth="Detection resolution"
Tracking.DetectWidth.Low="Low (320 px)"
Tracking.DetectWidth.Medium="Medium (480 px)"
Tracking.DetectWidth.High="High (640 px)"
Tracking.DetectWidth.Native="Native"
Tracking.DetectWidth.Description="Width of the frame the detector works on. Lower is faster; raise it if small or distant faces are missed. A smaller detection area is enlarged to fill this frame."

FrameArea="Frame area"
FrameArea.Description="The camera never shows anything outside this area; fully zoomed out it shows the whole area. Faces are only searched inside it."
FrameArea.Width="Width"
FrameArea.Height="Height"
FrameArea.OffsetX="Horizontal shift"
FrameArea.OffsetX.Description="Moves the area left (negative) or right (positive), e.g. when the camera is not centered on you."
FrameArea.OffsetY="Vertical shift"

Framing.Mode="Who to frame"
Framing.Mode.Description="Closest person: follows the largest face and switches only to a clearly larger one. Locked person: keeps the first person found and ignores everyone else until they are gone. Everyone: keeps all people in the frame."
Framing.Mode.SoloLargest="Closest person"
Framing.Mode.SoloLocked="Locked person"
Framing.Mode.Group="Everyone"
Framing.Mode.GroupLimited="Several largest"
Framing.MaxFaces="Number of people"
Framing.LockRelease="Wait for locked person"
Framing.LockRelease.Description="How long the locked person may be missing before someone else is picked."
Framing.Relock="Then pick"
Framing.Relock.Largest="Closest person"
Framing.Relock.Center="Person nearest the center"
Framing.Relock.Last="Person nearest the last position"
Framing.ResetLock="Pick again"

Framing="Framing"
Framing.PaddingX="Padding left/right"
Framing.PaddingY="Padding top/bottom"
Framing.Padding.Description="Space around the face, in percent of the face size."
Framing.OffsetX="Shift horizontally"
Framing.OffsetY="Shift vertically"
Framing.Offset.Description="Moves the framing relative to the face, in percent of the face size. A positive vertical shift shows more below the face."
Framing.MinZoom="Minimum zoom"
Framing.MinZoom.Description="1x allows zooming out to the whole frame area."
Framing.MaxZoom="Maximum zoom"
Framing.MaxZoom.Description="Limits how close the camera may get; high zoom makes the image softer."

Motion="Motion"
Motion.PositionSmoothing="Movement smoothing"
Motion.ZoomSmoothing="Zoom smoothing"
Motion.Smoothing.Description="Higher values make the camera glide more slowly and softly; 0 follows instantly."
Motion.DeadZone="Dead zone"
Motion.DeadZone.Description="Small head movements inside this zone (percent of the frame) do not move the camera."
Motion.ZoomStability="Zoom stability"
Motion.ZoomStability.Description="The face size must change by more than this before the camera zooms."
Motion.MaxPanSpeed="Max movement speed"
Motion.MaxPanSpeed.Description="Speed limit in percent of the frame width per second. 0 = no limit."
Motion.Prediction="Motion prediction"
Motion.Prediction.Description="Leads the camera ahead of the movement to compensate for detection delay. Too much can overshoot."

Idle="When nobody is found"
Idle.HoldTime="Hold framing for"
Idle.HoldTime.Description="Keeps the last framing for this long, e.g. when the face turns away for a moment."
Idle.Then="Then"
Idle.Then.ZoomOut="Zoom out to the frame area"
Idle.Then.KeepLast="Stay where it is"

Debug.View="Debug view"
Debug.View.Description="Shows the whole picture instead of the zoomed image, with outlines: detections (red), frame area (green), tracked people (yellow - framed, grey - ignored), framed target (blue) and camera frame (white). Writes detection speed to the OBS log every 5 seconds. Visible in the stream and recording too, so use it only while setting up."

Status.SdkUnavailable="NVIDIA AR SDK is not available"
Status.NeedD3D11="OBS must use the Direct3D 11 renderer"
Status.NeedNvidiaGpu="OBS is not rendering on an NVIDIA GPU"
Status.DetectorFailed="Detection failed"
Status.EffectMissing="Plugin data files are missing or broken (effects/autoframe.effect)"

Tracking.Target.Description="What the camera follows. Face gives tight head-and-shoulders framing; Body frames the whole visible figure."
Tracking.MinConfidence.Description="Detections the detector is less sure about are ignored. Raise it if objects are mistaken for faces, lower it if real faces are missed."
Framing.MaxFaces.Description="How many of the largest (closest) people are kept in the frame."
Framing.Relock.Description="Who is picked when the locked person is gone for longer than the wait time."
Framing.ResetLock.Description="Forgets the current person and picks again right now."

FrameArea.Size.Description="Size of the area in percent of the webcam picture."
FrameArea.OffsetY.Description="Moves the area up (negative) or down (positive)."

Framing.Description="How the person is placed in the frame and how close the camera may get."
Framing.Padding.Body.Description="Space around the body box, in percent of its size. Used when tracking the body."
Framing.Offset.Body.Description="Moves the framing relative to the body box, in percent of its size. Used when tracking the body."

Motion.Description="How the virtual camera moves between positions."
Idle.Description="What happens when nobody is detected."
Idle.Then.Description="Zoom out shows the whole frame area; Stay keeps the last framing until someone appears."

Output="Output"
Output.Description="Size and image quality of the filter output."
Output.Size="Output size"
Output.Size.Description="Same as webcam keeps the source size. Custom sets any size, e.g. 1080x1920 for a vertical stream; the camera then frames with that aspect ratio."
Output.Size.Source="Same as webcam"
Output.Size.Custom="Custom"
Output.Width="Width"
Output.Height="Height"
Output.Custom.Description="Output size in pixels."
Output.ScaleFilter="Scaling"
Output.ScaleFilter.Description="How the zoomed picture is scaled. Bilinear is the cheapest; Bicubic is sharper; Lanczos is the sharpest but may show slight halos on hard edges."
Output.ScaleFilter.Bilinear="Bilinear"
Output.ScaleFilter.Bicubic="Bicubic"
Output.ScaleFilter.Lanczos="Lanczos"

Status.Retrying="Detection will restart automatically in a few seconds."
Status.GaveUp="Automatic restarts did not help. Change any setting to try again."
